; ============================================================
;  ExamTimer 考核计时录屏器 - 配置文件
;  放在 ExamTimer.exe 同目录下，文件名为 examtimer.ini
;  行首用 ; 表示注释。所有项目都可以省略（使用程序默认值）。
;  程序里的“设置…”对话框会改写本文件。
; ============================================================

[record]
; 录像保存目录。相对路径相对于程序所在目录；不存在会自动建立。
; 支持中文目录名（程序内部统一按 UTF-8 处理，写盘用宽字符 API）。
out_dir=record

; 文件名模板。可用 %Y年 %m月 %d日 %H时 %M分 %S秒，%N 为自动序号
out_name=exam_%Y%m%d_%H%M%S.avi

; 帧率 1-30。考核录屏建议 5 帧/秒
fps=5

; JPEG 质量 1-100
quality=75

; 画面缩放百分比 10-100。50 表示缩到一半，文件约为 1/4
scale=100

; 1 = 4:2:0 色度抽样（文件小），0 = 4:4:4（文字更锐利，文件大）
subsample=1

; 1 = 截屏时连同分层窗口一起抓。XP 上会导致鼠标抖动，默认 0
captureblt=0

; 1 = 画面没变化时不重复压缩（省 CPU，不影响画质和时长）
skip_identical=1

; 单个文件达到多少 MB 自动分卷（0 = 自动，内部上限 1800MB）
split_mb=0

; 只录制指定区域，格式 左上X,左上Y,宽,高
;region=0,0,1024,768

; 声音：off=不录音，auto=优先系统声音(立体声混音)，test=测试用正弦波，N=设备序号
audio=off

; 按名称匹配录音设备（例如 立体声混音 / Stereo Mix / 麦克风）
audio_match=

[timer]
; 1 = 倒计时，0 = 正计时
countdown=0
countdown_seconds=3600

; 时间精度：hundredth = 00:00:00.00，tenth = 00:00:00.0，second = 00:00:00
granularity=tenth

[overlay]
; 1 = 在屏幕最上方显示悬浮计时器
enabled=1

; 位置：topleft 左上 / topcenter 顶部居中 / topright 右上 / custom 自定义
pos=topcenter
offset_x=0
offset_y=0

; 字号（像素）。1024x768 建议 44，1280x1024 建议 56，1920x1080 建议 72
fontsize=44

; 文字层（文字/边框/红点）与背景底板的不透明度，各 0-255。
; 也可以在“设置 -> 文字颜色/不透明度…”里用滑杆调整。
fg_alpha=255
bg_alpha=224

; 1 = 固定计时器：点击穿透、不可移动（推荐，绝不挡操作）
; 0 = 活动计时器：可用鼠标拖动位置、拖右下角缩放大小
fixed=1

show_label=1
show_rec_dot=1
show_border=1

; 计时器左侧的文字（可改成任意内容）
label=考核计时

; 颜色： #RRGGBB
fg=#FFE820
bg=#0C1420
border=#00C8FF

; 计时器默认会烧录进录像画面。如果某次不想让录像里出现计时器，
; 按 F11 隐藏计时器即可（隐藏后录像里也不再显示）。

; 每隔多少毫秒重新置顶一次，防止被其它置顶窗口盖住。0 = 不重复置顶
auto_topmost_ms=500

[hotkeys]
enabled=1
; 开始 / 暂停 录像
toggle=F8
; 开始 / 暂停 计时
timer=F9
; 停止并保存（录像 + 计时）
stop=F10
; 显示 / 隐藏 悬浮计时器
overlay=F11
; 固定 / 非固定
click_through=F12

[app]
; 1 = 程序启动后自动开始【录像】（计时器仍需按 F9 或点按钮才开始）
autostart=0

; N 秒后自动停止录像（0 = 不自动停止）
duration_sec=0

; 1 = 启动时最小化控制面板
minimize_control=0

; 1 = 显示托盘图标
tray=1

; 1 = 在标题栏显示当前用时
show_elapsed_in_title=1

; 日志文件。留空 = 程序目录下 examtimer.log
logfile=
